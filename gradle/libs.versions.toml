[versions]
# ── Core toolchain ────────────────────────────────────────────────────────────
agp                     = "8.9.0"
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.28"

# ── AndroidX / Jetpack ────────────────────────────────────────────────────────
coreKtx                 = "1.16.0"
lifecycleRuntimeKtx     = "2.9.0"
lifecycleViewmodelKtx   = "2.9.0"
activityCompose         = "1.10.1"
composeBom              = "2025.05.01"
navigationCompose       = "2.9.0"
room                    = "2.7.1"
cameraX                 = "1.4.2"

# ── DI ────────────────────────────────────────────────────────────────────────
hilt                    = "2.56.1"
hiltNavigationCompose   = "1.2.0"
datastore               = "1.1.1"
googleAuth              = "20.7.0"

# ── Firebase ─────────────────────────────────────────────────────────────────
firebaseBom             = "33.1.0"
googleServices          = "4.4.2"

# ── Kotlin ecosystem ─────────────────────────────────────────────────────────
coroutines              = "1.10.2"
serialization           = "1.8.1"
kotlinxDatetime         = "0.6.0"
# ── MediaPipe ─────────────────────────────────────────────────────────────────
mediapipe               = "0.10.14"

# ── Media3 ────────────────────────────────────────────────────────────────────
media3                  = "1.10.0"

# ── Ktor ──────────────────────────────────────────────────────────────────────
ktor                    = "2.3.12"

# ── Testing ───────────────────────────────────────────────────────────────────
junit                   = "4.13.2"
junitExt                = "1.2.1"
espresso                = "3.6.1"
coroutinesTest          = "1.10.2"
mockk                   = "1.14.2"
appcompat = "1.7.1"
material = "1.13.0"

[libraries]
# ── Kotlin stdlib ─────────────────────────────────────────────────────────────
kotlin-stdlib                   = { module = "org.jetbrains.kotlin:kotlin-stdlib",                  version.ref = "kotlin" }

# ── KotlinX ───────────────────────────────────────────────────────────────────
kotlinx-coroutines-core         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",       version.ref = "coroutines" }
kotlinx-coroutines-android      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",    version.ref = "coroutines" }
kotlinx-serialization-json      = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",    version.ref = "serialization" }

# ── AndroidX core ─────────────────────────────────────────────────────────────
androidx-core-ktx               = { module = "androidx.core:core-ktx",                              version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",            version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel    = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",           version.ref = "lifecycleViewmodelKtx" }
androidx-activity-compose       = { module = "androidx.activity:activity-compose",                  version.ref = "activityCompose" }
androidx-navigation-compose     = { module = "androidx.navigation:navigation-compose",              version.ref = "navigationCompose" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
# ── Compose BOM + individual artifacts ────────────────────────────────────────
compose-bom                     = { module = "androidx.compose:compose-bom",                        version.ref = "composeBom" }
compose-ui                      = { module = "androidx.compose.ui:ui" }
compose-ui-graphics             = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview      = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling              = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest        = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4          = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material3               = { module = "androidx.compose.material3:material3" }
compose-material-icons          = { module = "androidx.compose.material:material-icons-extended" }

# ── Room ──────────────────────────────────────────────────────────────────────
room-runtime                    = { module = "androidx.room:room-runtime",                          version.ref = "room" }
room-ktx                        = { module = "androidx.room:room-ktx",                              version.ref = "room" }
room-compiler                   = { module = "androidx.room:room-compiler",                         version.ref = "room" }

# ── CameraX ───────────────────────────────────────────────────────────────────
camera-core                     = { module = "androidx.camera:camera-core",                         version.ref = "cameraX" }
camera-camera2                  = { module = "androidx.camera:camera-camera2",                      version.ref = "cameraX" }
camera-lifecycle                = { module = "androidx.camera:camera-lifecycle",                    version.ref = "cameraX" }
camera-view                     = { module = "androidx.camera:camera-view",                         version.ref = "cameraX" }

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt-android                    = { module = "com.google.dagger:hilt-android",                      version.ref = "hilt" }
hilt-compiler                   = { module = "com.google.dagger:hilt-compiler",                     version.ref = "hilt" }
hilt-navigation-compose         = { module = "androidx.hilt:hilt-navigation-compose",               version.ref = "hiltNavigationCompose" }

# ── Firebase ─────────────────────────────────────────────────────────────────
firebase-bom                    = { module = "com.google.firebase:firebase-bom",                    version.ref = "firebaseBom" }
firebase-auth-ktx               = { module = "com.google.firebase:firebase-auth-ktx" }
firebase-firestore-ktx          = { module = "com.google.firebase:firebase-firestore-ktx" }

# ── Persistence ───────────────────────────────────────────────────────────────
androidx-datastore-preferences  = { module = "androidx.datastore:datastore-preferences",            version.ref = "datastore" }

# ── Google Auth ───────────────────────────────────────────────────────────────
play-services-auth              = { module = "com.google.android.gms:play-services-auth",            version.ref = "googleAuth" }

# ── MediaPipe ─────────────────────────────────────────────────────────────────
mediapipe-tasks-vision          = { module = "com.google.mediapipe:tasks-vision",                   version.ref = "mediapipe" }

# ── Media3 ────────────────────────────────────────────────────────────────────
media3-exoplayer                = { module = "androidx.media3:media3-exoplayer",                   version.ref = "media3" }
media3-ui                       = { module = "androidx.media3:media3-ui",                          version.ref = "media3" }

# ── Ktor ──────────────────────────────────────────────────────────────────────
ktor-client-core                = { module = "io.ktor:ktor-client-core",                           version.ref = "ktor" }
ktor-client-okhttp              = { module = "io.ktor:ktor-client-okhttp",                         version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation",              version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json",            version.ref = "ktor" }
ktor-client-logging             = { module = "io.ktor:ktor-client-logging",                        version.ref = "ktor" }

# ── Testing ───────────────────────────────────────────────────────────────────
test-junit                      = { module = "junit:junit",                                         version.ref = "junit" }
test-junit-ext                  = { module = "androidx.test.ext:junit",                             version.ref = "junitExt" }
test-espresso                   = { module = "androidx.test.espresso:espresso-core",                version.ref = "espresso" }
test-coroutines                 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",       version.ref = "coroutinesTest" }
test-mockk                      = { module = "io.mockk:mockk",                                      version.ref = "mockk" }
test-kotlin                     = { module = "org.jetbrains.kotlin:kotlin-test",                    version.ref = "kotlin" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
javax-inject = { module = "javax.inject:javax.inject", version = "1" }

[plugins]
android-application             = { id = "com.android.application",                    version.ref = "agp" }
android-library                 = { id = "com.android.library",                        version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-jvm                      = { id = "org.jetbrains.kotlin.jvm",                   version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
kotlin-compose                  = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                            = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                             = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
google-services                 = { id = "com.google.gms.google-services",             version.ref = "googleServices" }